databases:
  - name: primeconnect-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: primeconnect-backend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd primeconnect-backend && npm install
    startCommand: cd primeconnect-backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: primeconnect-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: UPLOADS_DIR
        value: /var/data/uploads
